services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexthr-db
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Dang@12345
      - TZ=Asia/Ha_Noi
      - MSSQL_AGENT_ENABLED=True  #lập lịch sao lưu
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db:/init-db:ro
      - "U:/Hoàng Quốc Việt năm 3/Năm 3 kỳ 2/Hệ quản trị CSDL/Backup:/backup" #thay đổi theo máy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexthr-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-db:/init-db:ro
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Dang@12345' -C -i /init-db/SchemaNEXTHR.sql"
    networks:
      - app-network
    restart: 'no'

  redis:
    image: redis:alpine
    container_name: nexthr-redis
    ports:
      - "6380:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local