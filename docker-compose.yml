services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexthr-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Dang@12345
      MSSQL_AGENT_ENABLED: "True"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "1435:1433"
    networks:
      - nexthr-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexthr-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./be/init-db:/init-db:ro
    entrypoint: |
      /bin/bash -c "
      echo 'Running SchemaNEXTHR.sql...'
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Dang@12345' -C -i /init-db/SchemaNEXTHR.sql
      echo 'Applying database updates in order...'
      for f in /init-db/updates/*.sql; do
        if [ -f \"$$f\" ]; then
          echo \"Applying update: $$f\"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Dang@12345' -C -i \"$$f\"
        fi
      done
      echo 'Database initialization complete!'
      "
    networks:
      - nexthr-network
    restart: "no"

  redis:
    image: redis:alpine
    container_name: nexthr-redis
    ports:
      - "6380:6379"
    networks:
      - nexthr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: nexthr-be
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      PORT: 3005
      DB_TYPE: mssql
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: Dang@12345
      DB_DATABASE: NextHR
      DB_SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CONTROL_API_BASE_URL: http://localhost:3001
      CONTROL_API_TIMEOUT: 5000
      JWT_SECRET: dangdeptraiquadi
      JWT_EXPIRES_IN: 1d
      ALLOWED_ORIGINS: http://localhost:3006,http://127.0.0.1:3006,http://localhost:3001,http://localhost:3000
    ports:
      - "3005:3005"
    networks:
      - nexthr-network
    restart: unless-stopped

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3005/api
    container_name: nexthr-fe
    depends_on:
      - be
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3005/api
    ports:
      - "3006:3000"
    networks:
      - nexthr-network
    restart: unless-stopped

networks:
  nexthr-network:
    driver: bridge
