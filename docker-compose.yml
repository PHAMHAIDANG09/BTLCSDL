services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexthr-db
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Dang@12345
      - TZ=Asia/Ha_Noi
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db:/init-db:ro
    networks:
      - app-network
    healthcheck:
        test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-U", "sa", "-P", "Dang@12345", "-Q", "SELECT 1"]
        interval: 10s 
        timeout: 3s
        retries: 10
        start_period: 10s

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: nexthr-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-db:/init-db:ro
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'Dang@12345' -i /init-db/SchemaNEXTHR.sql
      "
    networks:
      - app-network
    restart: 'no'

  redis:
    image: redis:alpine
    container_name: nexthr-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
